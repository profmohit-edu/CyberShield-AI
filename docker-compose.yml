services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    environment:
      CYBERSHIELD_ENVIRONMENT: container
      CYBERSHIELD_ENABLE_API_DOCS: "true"
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
